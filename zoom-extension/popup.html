<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
body{width:300px;margin:0;padding:10px 12px;font:13px/1.5 sans-serif}h3{margin:0 0 6px}.n{color:#888;font-size:11px}
textarea{width:100%;box-sizing:border-box;font-size:12px}
</style></head><body>
<h3>圖片懸停放大 Hover Image Zoom</h3>
<p><label><input type="checkbox" id="hz"> 啟用（所有網站） / Enabled</label><br>
<span class="n">滑鼠停在圖片上顯示大圖；按住 Shift 暫停。預覽時按右鍵釘選置中：移動滑鼠看圖、滾輪縮放、右鍵選單可另存、可拖到別的分頁；Esc 或點背景關閉。</span></p>
<p>不要放大的網站（每行一個網域，含子網域）/ Disabled sites:<br>
<textarea id="zd" rows="4" placeholder="example.com"></textarea>
<button id="zds">儲存 / Save</button> <span id="zdok" class="n"></span></p>
<p class="n">不收集、不傳送任何資料。只在本機儲存上面兩個設定。</p>
<script src="popup.js"></script></body></html>
